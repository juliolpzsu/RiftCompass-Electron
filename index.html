<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP is set as a real response header from the main process
      (electron/main.ts's applyContentSecurityPolicy) instead of a <meta>
      tag here — a static tag ships identically to dev and production, so
      it couldn't actually gate 'unsafe-eval' (needed for Vite's dev-mode
      HMR client, not for the packaged app) to dev only.
    -->
    <title>RiftCompass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
